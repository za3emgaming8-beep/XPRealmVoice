<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>XPRealm Voice</title>
  <style>
    body{font-family:system-ui,sans-serif;background:#0c1020;color:#fff;display:flex;justify-content:center;margin:0;padding:30px}
    .card{width:min(560px,100%);background:#171d33;border-radius:20px;padding:24px;box-shadow:0 12px 40px #0008}
    h1{margin-top:0} button{padding:12px 16px;border:0;border-radius:12px;margin:5px;font-weight:700;cursor:pointer}
    .primary{background:#4ea1ff;color:#fff}.danger{background:#ef6262;color:#fff}.muted{opacity:.6}.pill{display:inline-block;padding:5px 10px;border-radius:999px;background:#27304f;margin:3px}
    #status{margin:12px 0;color:#9ed0ff}
  </style>
</head>
<body>
<div class="card">
  <h1>🎙 XPRealm Voice</h1>
  <div id="status">Connecting…</div>
  <div>
    <button class="primary" id="enable">🎤 Enable microphone</button>
    <button id="mute">🎤 Mute</button>
    <button id="deafen">🔊 Deafen</button>
  </div>
  <p id="players">Nearby audio appears here automatically.</p>
</div>
<script src="/voice.js"></script>
</body>
</html>
